<script>

lotto535:{name:"Lotto 5/35",dn:5,max:35,pick:5,bonus:1,col:COL.g,sp:COL.o,src:"lotto535"},
max3d:{name:"Max 3D",d3:1,k:1,col:COL.p,src:"max3d"},
max3dplus:{name:"Max 3D+",d3:1,k:1,col:COL.p,src:"max3d"},
max3dpro:{name:"Max 3D Pro",d3:1,k:2,col:COL.p,src:"max3dpro"}};

for(const k in GAMES)$("g").add(new Option(GAMES[k].name,k));

const G=()=>GAMES[$("g").value];
async function j(u){const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
function resetMeter(){sets=[];P=null;$("ms").textContent="CHỜ TÍNH...";$("mf").style.width="0";$("tier").textContent="";$("mt").innerHTML="";$("out").innerHTML="<small>Chưa có</small>"}
function balls(g,d){
 if(!d)return"—";const c=g.col;
 if(g.d3)return d.nums.slice(0,6).map((x,i)=>(i==3?'<span class="sep"></span>':"")+`<span class="b" style="background:${c}">${x}</span>`).join("");
 return d.nums.map((x,i)=>(g.sp&&i==g.dn?'<span class="sep"></span>':"")+`<span class="b" style="background:${i>=g.dn&&g.sp?g.sp:c}">${String(x).padStart(2,"0")}</span>`).join("")}
async function load(){
 const g=G();let ok=false,msg="";
 try{S=await j("data/status.json")}catch(e){S=null}
 let base=[];try{base=(await j("data/"+g.src+".json")).draws}catch(e){}
 const old=D[g.src],mn=man(g.src),lv=await liveFetch(g);D[g.src]=merge(merge(base,mn),lv?[lv]:[]);
 const kn=known[g.src]||(known[g.src]=new Set()),fresh=D[g.src].filter(d=>!kn.has(d.id));fresh.forEach(d=>kn.add(d.id));
 if(old&&fresh.length)resetMeter();
 const dr=D[g.src],gs=S?.games?.[g.src],age=S?Date.now()-new Date(S.updated):1e12;
 const ld=dr[0]?.date,dd=ld?(Date.now()-new Date(ld))/864e5:1e9,vn=ld?ld.split("-").reverse().slice(0,2).join("/"):"";
 if(dr.length&&dd<=4&&(lv||((gs?.ok||!gs)&&age<24*36e5)||mn.length)){ok=true;$("st").className="ok";$("st").textContent=(lv?"LIVE vietlott.vn":"Dữ liệu thật")+(mn.length?" + nhập tay":"")+" · đến "+vn}
 else if(dr.length){$("st").className="warn";$("st").textContent="Dữ liệu cũ · đến "+vn}
 else{$("st").className="bad";$("st").textContent="Chưa có dữ liệu thật"}
 $("go").disabled=dr.length<30;setLive();
 const key=g.src+"|"+(lv?lv.id:"x")+"|"+base.length+"|"+mn.length;
 if(key!=lastKey){lastKey=key;log("Data",lv?"LIVE vietlott.vn: đọc được kỳ #"+lv.id+" ("+lv.date.split("-").reverse().join("/")+") · "+g.name:"Live vietlott.vn không khả dụng cho "+g.name+": "+liveErr);
  log("Data","Đồng bộ "+base.length+" kỳ từ data/"+g.src+".json trong repo"+(mn.length?" + "+mn.length+" kỳ nhập tay":""))}
 $("note").textContent=dr.length<30?"Cần ≥30 kỳ thật để chạy AI (hiện "+dr.length+"). Chờ GitHub Actions nạp dữ liệu.":(gs&&!gs.ok&&!lv?"Lỗi nạp dữ liệu: "+gs.error:(lv?"Kỳ mới nhất: trực tiếp từ vietlott.vn (qua Worker). Lịch sử: repo + bản sao vietlott-data.":"Nguồn: repo + bản sao công khai vietlott-data (có thể chậm hơn vietlott.vn)."));
 const l=dr[0];$("last").innerHTML=balls(g,l);$("lm").textContent=l?`Kỳ #${l.id} · ${l.date} · ${dr.length} kỳ trong kho`:"";
 $("jp").textContent=l?.jp?l.jp.toLocaleString("vi-VN")+"đ":"";$("jp").parentElement.style.display=l?.jp?"":"none";
 stats(g,dr)}
function weights(dr){return dr.map((_,i)=>Math.pow(.995,i))}
function freqP(g,dr){ // p[pos][idx]
 const w=weights(dr);
 if(g.d3){const p=[0,1,2].map(()=>Array(10).fill(.01));dr.forEach((d,i)=>d.nums.forEach((x,t)=>p[t%3][x]+=w[i]));return p.map(norm)}
 const p=Array(g.max).fill(.01);dr.forEach((d,i)=>d.nums.slice(0,g.dn).forEach(x=>p[x-1]+=w[i]));return[norm(p)]}
function markovP(g,dr){
 if(g.d3)return freqP(g,dr);
 const T=Array.from({length:g.max},()=>Array(g.max).fill(.01));
 for(let i=1;i<dr.length;i++){const a=dr[i].nums.slice(0,g.dn),b=dr[i-1].nums.slice(0,g.dn);a.forEach(x=>b.forEach(y=>T[x-1][y-1]+=1))}
 const p=Array(g.max).fill(0);dr[0].nums.slice(0,g.dn).forEach(x=>{const s=T[x-1].reduce((a,b)=>a+b);T[x-1].forEach((v,i)=>p[i]+=v/s)});return[norm(p)]}
const norm=a=>{const s=a.reduce((x,y)=>x+y);return a.map(v=>v/s)};
function pick(p){let r=Math.random(),i=0;for(;i<p.length-1;i++){r-=p[i];if(r<=0)break}return i}
function gen(g,pp){
 if(g.d3)return Array.from({length:g.k},()=>[0,1,2].map(t=>pick(pp[t])).join(""));
 const s=[];while(s.length<g.pick){const v=pick(pp[0])+1;if(g.rep||!s.includes(v))s.push(v)}return g.rep?s:s.sort((a,b)=>a-b)}
function okSet(g,s){
 if(g.d3)return s.length==g.k&&s.every(x=>/^\d{3}$/.test(x));
 return s.length==g.pick&&s.every(x=>Number.isInteger(x)&&x>=1&&x<=g.max)&&(g.rep||new Set(s).size==s.length)}
function lift(g,pp,s){
 if(g.d3)return s.reduce((a,x)=>a+[0,1,2].reduce((b,t)=>b+pp[t][+x[t]]*10,0)/3,0)/s.length;
 return s.reduce((a,x)=>a+pp[0][x-1],0)/s.length*g.max}
const cl=x=>Math.max(0,Math.min(1,x));
function meter(g,dr,pp,ss,fresh){
 const L=ss.map(s=>lift(g,pp,s)),m=L.reduce((a,b)=>a+b)/L.length,sd=Math.sqrt(L.reduce((a,b)=>a+(b-m)**2,0)/L.length);
 const flat=pp.flat(),pool=flat.length,top=[...flat].sort((a,b)=>b-a).slice(0,Math.max(1,Math.ceil(pool*.1))),
  topMass=top.reduce((a,b)=>a+b)/(top.length/pool),H=-flat.reduce((a,v)=>a+v*Math.log(v),0)/pp.length,conc=1-H/Math.log(pool/pp.length);
 const fp=freqP(g,dr.slice(0,60)),ref=fp.map(p=>[...p].map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,g.d3?5:g.pick*2).map(x=>x[1]));
 let hit=0,tot=0;ss.forEach(s=>{if(g.d3)s.forEach(x=>[0,1,2].forEach(t=>{tot++;if(ref[t].includes(+x[t]))hit++}));else s.forEach(x=>{tot++;if(ref[0].includes(x-1))hit++})});
 const v=ss.filter(s=>okSet(g,s)).length/ss.length;
 const f={mean:cl((m-.9)/.6),top:cl((topMass-1)/.5),conc:cl(conc*30),sep:cl((Math.max(...L)-1)/.8),stab:ss.length<2?.5:cl(1-sd/m),dq:cl(dr.length/300)*(fresh?1:.3),agree:hit/tot,valid:v};
 f.score=Math.round(100*v*(.2*f.mean+.15*f.top+.1*f.conc+.15*f.sep+.1*f.stab+.15*f.dq+.15*f.agree));return f}
function show(f){
 $("ms").textContent=f.score+"%";$("mf").style.width=f.score+"%";
 $("tier").textContent=f.score>=75?"CAO":f.score>=55?"KHÁ":f.score>=35?"TRUNG BÌNH":"THẤP";
 const n={mean:"Mean",top:"Top 10% mass",conc:"Concentration",sep:"Separation",stab:"Stability",dq:"Data quality",agree:"Agreement",valid:"Validation"};
 $("mt").innerHTML=Object.keys(n).map(k=>`<span>${n[k]} <b>${Math.round(f[k]*100)}%</b></span>`).join("")}
function stats(g,dr){
 if(!dr.length){$("hot").innerHTML="";$("sm").textContent="";return}
 const c={};dr.forEach(d=>(g.d3?d.nums:d.nums.slice(0,g.dn)).forEach(x=>c[x]=(c[x]||0)+1));
 const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);$("sm").textContent=`(${dr.length} kỳ thật)`;
 const f=a=>a.slice(0,6).map(x=>`${g.d3?x[0]:String(x[0]).padStart(2,"0")}×${x[1]}`).join(" ");
 $("hot").innerHTML=`<tr><td>Ra nhiều</td><td>${f(e)}</td></tr><tr><td>Ra ít</td><td>${f([...e].reverse())}</td></tr>`}
async function run1(){
 const g=G(),dr=D[g.src];if(!dr||dr.length<30)return;
 let mo=$("mo").value,auto=mo=="auto",note="";if(auto)mo=autoModel(g,dr.length);
 if(g.d3&&mo!="freq"){mo="freq";note=" (Max 3D: tần suất theo vị trí)"}
 if((mo=="dense"||mo=="lstm")&&(navigator.hardwareConcurrency||4)<=4){mo="markov";note=" (thiết bị yếu → Markov)"}
 stt("Đang phân tích",5);$("ost").textContent="Đang phân tích "+g.name+"…";
 log("Model",(auto?"Tự chọn ":"")+MODELS[mo]+" cho "+g.name+" ("+dr.length+" kỳ thật)"+note);
 let pp;try{pp=mo=="markov"?markovP(g,dr):mo=="freq"?freqP(g,dr):await nnP(g,dr,mo)}catch(e){mo="freq";note=" (AI nâng cao lỗi → Frequency)";pp=freqP(g,dr)}
  if(mo=="markov")log("Markov","Đã quét "+(dr.length-1)+" cặp kỳ liên tiếp");
 if(window.tf)$("eng").textContent=tf.getBackend().toUpperCase();
 if($("bd").value){pp=bdP(g,pp,$("bd").value);log("Ngày sinh","Đã nghiêng xác suất về các số rút từ ngày sinh (giải trí)")}P=pp;
 const n=+$("n").value;sets=[];let guard=0;
 while(sets.length<n&&guard++<500){const s=gen(g,pp);if(!sets.some(t=>t.join()==s.join()))sets.push(s)}
 const c=g.col;$("out").innerHTML=sets.map(s=>"<div>"+(g.d3?s.map(x=>[...x].map(d=>`<span class="b" style="background:${c}">${d}</span>`).join("")).join('<span class="sep"></span>'):s.map(x=>`<span class="b" style="background:${c}">${String(x).padStart(2,"0")}</span>`).join(""))+"</div>").join("");
 const mf=meter(g,dr,pp,sets,$("st").className=="ok");show(mf);stt("Hoàn tất!",100);log("Xong","Đã sinh "+sets.length+" bộ số hợp lệ · điểm chất lượng "+mf.score+"% (không phải xác suất trúng)");
 $("ost").innerHTML="🎯 Đang phân tích · dự đoán: <b>"+g.name+"</b> · "+MODELS[mo]+(auto?" (tự chọn)":"")+note+" · "+dr.length+" kỳ · Kết nối: "+($("live").className=="ok"?"LIVE vietlott.vn":"repo")+($("bd").value?" · ngày sinh":"");
 fire();chime()}
$("go").onclick=async()=>{$("go").disabled=true;try{await run1()}catch(e){$("note").textContent="Lỗi: "+e.message}finally{const d=D[G().src];$("go").disabled=!d||d.length<30}};
const MODELS={freq:"Frequency Weighted",markov:"Markov Chain",dense:"Dense DNN",lstm:"LSTM"};
const WK="https://super-claude.nguyenchemical.workers.dev/";let known={},liveAtBy={},tfp=null,SND=true,AC;
function autoModel(g,n){if(g.d3)return"freq";if(n<150)return"freq";return g.src=="lotto535"?"lstm":"dense"}
const LIVE=["mega645","power655","lotto535","max3d","max3dpro"];let liveErr="",lastKey="";
async function liveFetch(g){liveErr="";if(!LIVE.includes(g.src)){liveErr="game này chưa có nguồn live (kết quả được tải bằng AJAX và bị Cloudflare chặn)";return null}
 try{const r=await fetch(WK+"?action=latest&game="+g.src,{cache:"no-store"}),d=await r.json();if(d.ok&&d.draw&&okDraw(g,d.draw)){liveAtBy[g.src]=Date.now();return d.draw}liveErr=d.error||"dữ liệu không hợp lệ"}catch(e){liveErr="không kết nối được Worker"}return null}
function log(t,m){const l=$("lg"),d=document.createElement("div");d.textContent="["+t+"] "+m;l.appendChild(d);while(l.children.length>30)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight}
function stt(s,p){$("stt").textContent=s;if(p!=null)$("pb").style.width=p+"%"}
function setLive(){const l=$("live");if(!navigator.onLine){l.className="bad";l.textContent="● Offline"}else if(Date.now()-(liveAtBy[G().src]||0)<3*6e4){l.className="ok";l.textContent="● LIVE online vietlott.vn"}else{l.className="warn";l.textContent=LIVE.includes(G().src)?"● Online · live đang lỗi, dùng repo":"● Online · game này chưa có live"}}
addEventListener("online",setLive);addEventListener("offline",setLive);
function loadTF(){return tfp||(tfp=new Promise((ok,no)=>{const u=["https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.22.0/tf.min.js","https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"];let i=0;
 (function t(){const s=document.createElement("script");s.src=u[i];s.onload=ok;s.onerror=()=>{if(++i<u.length)t();else no(new Error("tf"))};document.head.appendChild(s)})()}))}
async function nnP(g,dr,kind){
 await loadTF();const pool=g.max,W=kind=="lstm"?5:3,ord=[...dr].reverse().slice(-220);
 const M=ord.map(d=>{const v=Array(pool).fill(0);d.nums.slice(0,g.dn).forEach(x=>v[x-1]=1);return v}),X=[],Y=[];
 for(let i=W;i<M.length;i++){X.push(M.slice(i-W,i));Y.push(M[i])}
 if(X.length<40)throw new Error("few");
 const xs=kind=="lstm"?tf.tensor3d(X):tf.tensor2d(X.map(s=>s.flat())),ys=tf.tensor2d(Y),m=tf.sequential();
 m.add(kind=="lstm"?tf.layers.lstm({units:16,inputShape:[W,pool]}):tf.layers.dense({units:32,activation:"relu",inputShape:[W*pool]}));
 m.add(tf.layers.dropout({rate:.2}));m.add(tf.layers.dense({units:pool,activation:"sigmoid"}));
 m.compile({optimizer:tf.train.adam(.01),loss:"binaryCrossentropy"});
 await m.fit(xs,ys,{epochs:12,batchSize:32,shuffle:true,callbacks:{onEpochEnd:async(e,l)=>{$("ost").textContent="Huấn luyện "+MODELS[kind]+"… epoch "+(e+1)+"/12 · loss "+l.loss.toFixed(3);$("pb").style.width=((e+1)/12*100)+"%";await tf.nextFrame()}}});
 const last=M.slice(-W),inp=kind=="lstm"?tf.tensor3d([last]):tf.tensor2d([last.flat()]),o=norm(Array.from(m.predict(inp).dataSync()).map(v=>v+1e-4));
 xs.dispose();ys.dispose();inp.dispose();m.dispose();
 const f=freqP(g,dr.slice(0,200))[0];return[norm(o.map((v,i)=>.5*v+.5*f[i]))]}
function bdP(g,pp,v){const[y,m,d]=v.split("-").map(Number),S=new Set(),yy=y%100;
 if(g.d3){[d,m,yy,d+m,d+m+yy].forEach(x=>String(x).split("").forEach(c=>S.add(+c)));return pp.map(p=>norm(p.map((q,i)=>S.has(i)?q*1.6:q)))}
 [d,m,yy,d+m,d+yy,m+yy,d+m+yy].forEach(x=>S.add(((x-1)%g.max)+1));return pp.map(p=>norm(p.map((q,i)=>S.has(i+1)?q*1.6:q)))}
function chime(){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>{const o=AC.createOscillator(),n=AC.createGain(),t=AC.currentTime+i*.09;o.type="triangle";o.frequency.value=f;o.connect(n);n.connect(AC.destination);n.gain.setValueAtTime(.001,t);n.gain.exponentialRampToValueAtTime(.15,t+.02);n.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.4)});navigator.vibrate&&navigator.vibrate(60)}catch(e){}}

function fire(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=$("fx"),x=c.getContext("2d"),Q=[];c.width=innerWidth;c.height=innerHeight;
 for(let b=0;b<4;b++){const cx=innerWidth*(.2+.6*Math.random()),cy=innerHeight*(.15+.3*Math.random()),h=Math.random()*360;for(let i=0;i<50;i++){const a=6.283*i/50,s=2+Math.random()*3;Q.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,h,t:b*12})}}
 let f=0;(function st(){x.clearRect(0,0,c.width,c.height);Q.forEach(p=>{if(f<p.t)return;p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.99;p.l--;if(p.l>0){x.fillStyle="hsla("+p.h+",100%,60%,"+p.l/90+")";x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()}});if(++f<150)requestAnimationFrame(st);else x.clearRect(0,0,c.width,c.height)})()}
function man(src){try{return JSON.parse(localStorage.getItem("vl_man_"+src)||"[]")}catch(e){return[]}}
function merge(a,b){const m=new Map();[...a,...b].forEach(d=>m.set(d.id,d));return[...m.values()].sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:y.id-x.id).slice(0,600)}
function okDraw(g,d){const a=d.nums;
 if(g.d3)return a.length>=6&&a.length%3==0&&a.every(x=>x>=0&&x<=9);
 return a.length==g.dn+(g.bonus||0)&&a.every(x=>x>=1&&x<=g.max)&&(g.rep||new Set(a.slice(0,g.dn)).size==g.dn)}
function parseImp(g,txt){const ok=[],bad=[];
 txt.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(l=>{
  const id=(l.match(/#\s*(\d{3,7})/)||[])[1],dm=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!id||!dm){bad.push(l);return}
  const rest=l.replace(/#\s*\d+/,"").replace(dm[0],"").replace(/Th[ứu]\s*\d/i,"").replace(/\d{1,2}:\d{2}/,"").replace(/[^\d\s,;|]/g," ");
  const t=rest.match(/\d+/g)||[],nums=g.d3?t.join("").split("").map(Number):t.map(Number);
  const d={id,date:dm[3]+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0"),nums,jp:null};
  (okDraw(g,d)?ok:bad).push(okDraw(g,d)?d:l)});
 return{ok,bad}}
$("impgo").onclick=()=>{const g=G(),r=parseImp(g,$("imp").value);
 if(r.ok.length){try{localStorage.setItem("vl_man_"+g.src,JSON.stringify(merge(man(g.src),r.ok)))}catch(e){}$("imp").value="";resetMeter();load()}
 $("impmsg").textContent="Đã thêm "+r.ok.length+" kỳ"+(r.bad.length?"; "+r.bad.length+" dòng sai định dạng/luật: "+r.bad[0].slice(0,40):"")};
$("impex").onclick=async()=>{const m=man(G().src);try{await navigator.clipboard.writeText(JSON.stringify(m));$("impmsg").textContent="Đã chép sao lưu "+m.length+" kỳ"}catch(e){$("impmsg").textContent="Không chép được"}};
$("impdel").onclick=()=>{try{localStorage.removeItem("vl_man_"+G().src)}catch(e){}resetMeter();load();$("impmsg").textContent="Đã xóa dữ liệu nhập tay của game này"};
