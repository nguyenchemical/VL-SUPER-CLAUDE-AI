<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<title>Vietlott Super Claude AI</title>
<script>
(()=>{const u=new URL("icon.png",location.href).href,s=new URL("./",location.href).href;
const m={name:"Vietlott Super Claude AI",short_name:"Super Claude",start_url:s,scope:s,display:"standalone",background_color:"#0f172a",theme_color:"#0f172a",icons:[192,512].map(z=>({src:u,sizes:z+"x"+z,type:"image/png",purpose:"any"}))};
const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l)})();
</script>
<style>details{margin-top:4px}summary{cursor:pointer;color:#fcd34d;padding:4px 0}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{height:100dvh;background:#0f172a;color:#e2e8f0;font:clamp(12px,1.9vh,15px) system-ui,sans-serif;display:flex;flex-direction:column;gap:8px;
padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
header{flex:none;display:flex;align-items:center;justify-content:center;gap:14px}
header img{height:clamp(64px,15vh,140px);aspect-ratio:1;width:auto;border-radius:22%;border:0;display:block}
header div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
h1{font-size:clamp(16px,3.2vh,30px);margin:0;line-height:1.15}
main{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;
grid-template-areas:"ctl" "last" "out" "meter" "hot"}
.c{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:8px 10px;min-height:0;min-width:0}
.c.o{display:flex;flex-direction:column}#out{flex:1;min-height:0;overflow:auto}
select,button{width:100%;padding:clamp(7px,1.4vh,11px);border-radius:10px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:inherit;margin:3px 0}
button{background:#dc2626;border:0;font-weight:700}button:disabled{opacity:.4}.row{display:flex;gap:8px}.row>*{flex:1}
.b{display:inline-flex;width:clamp(26px,4.6vh,40px);height:clamp(26px,4.6vh,40px);border-radius:50%;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:clamp(11px,2vh,16px);margin:2px;box-shadow:inset 0 -4px 6px #0005}
.sep{display:inline-block;width:2px;height:clamp(20px,3.6vh,30px);background:#64748b;margin:0 6px;vertical-align:middle}
#st{font-size:12px;padding:3px 9px;border-radius:99px}.ok{background:#064e3b;color:#6ee7b7}.warn{background:#78350f;color:#fcd34d}.bad{background:#7f1d1d;color:#fca5a5}
.m{height:10px;background:#334155;border-radius:9px;overflow:hidden;margin:4px 0}.m i{display:block;height:100%;width:0;background:#f59e0b;transition:width .5s}
.chips{display:flex;flex-wrap:wrap;gap:4px;font-size:.85em;color:#94a3b8}.chips span{background:#0f172a;border-radius:8px;padding:2px 7px}.chips b{color:#e2e8f0}
small{color:#94a3b8}table{width:100%;font-size:.9em;color:#94a3b8}
@media(min-width:900px) and (min-height:520px){
 main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"ctl out" "last out" "hot meter"}
}
</style></head><body>
<header><img src="icon.png" alt="Vietlott Super Claude AI"><div><h1>Vietlott Super Claude AI</h1><span id="st" class="warn">Đang kiểm tra…</span></div></header>
<main>
<section class="c" style="grid-area:ctl"><select id="g"></select><div class="row"><select id="mo"><option value="freq">Frequency Weighted</option><option value="markov">Markov Chain</option></select><select id="n"></select></div><button id="go">Tạo bộ số</button><small id="note"></small>
<details><summary>Nạp kết quả mới (nhập tay)</summary>
<textarea id="imp" rows="3" placeholder="Mỗi dòng 1 kỳ, ví dụ:&#10;#01569 30/09/2026 02 09 24 27 30 33" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:10px;padding:8px;font:inherit"></textarea>
<div class="row"><button id="impgo">Thêm</button><button id="impex">Sao lưu</button><button id="impdel">Xóa</button></div><small id="impmsg"></small></details></section>
<section class="c" style="grid-area:last"><b>Kỳ quay mới nhất (thật)</b> <small id="lm"></small><div id="last">—</div><div>Jackpot thật: <b id="jp">—</b></div></section>
<section class="c o" style="grid-area:out"><b>Bộ số AI sinh ra</b><div id="out"><small>Chưa có</small></div></section>
<section class="c" style="grid-area:meter"><b>Jackpot Meter</b> <span id="tier"></span> <b id="ms">CHỜ TÍNH...</b><div class="m"><i id="mf"></i></div><div class="chips" id="mt"></div><small>Điểm chất lượng bộ số theo mô hình, không phải xác suất trúng.</small></section>
<section class="c" style="grid-area:hot"><b>Thống kê thật</b> <small id="sm"></small><table id="hot"></table></section>
</main>
<script>
const COL={r:"#dc2626",g:"#16a34a",y:"#b8860b",p:"#a21caf",o:"#f97316",b:"#2563eb"};
const GAMES={
mega645:{name:"Mega 6/45",dn:6,max:45,pick:6,col:COL.r,src:"mega645"},
power655:{name:"Power 6/55",dn:6,max:55,pick:6,bonus:1,col:COL.y,sp:COL.r,src:"power655"},
lotto535:{name:"Lotto 5/35",dn:5,max:35,pick:5,bonus:1,col:COL.g,sp:COL.o,src:"lotto535"},
max3d:{name:"Max 3D",d3:1,k:1,col:COL.p,src:"max3d"},
max3dplus:{name:"Max 3D+",d3:1,k:1,col:COL.p,src:"max3d"},
max3dpro:{name:"Max 3D Pro",d3:1,k:2,col:COL.p,src:"max3dpro"},
keno:{name:"Keno",dn:20,max:80,pick:10,col:COL.b,src:"keno"},
bingo18:{name:"Bingo 18",dn:3,max:6,pick:3,rep:1,col:COL.o,src:"bingo18"}};
const $=id=>document.getElementById(id);
let D={},S=null,P=null,sets=[];
for(const k in GAMES)$("g").add(new Option(GAMES[k].name,k));
for(let i=1;i<=10;i++)$("n").add(new Option(i+" bộ số",i));
const G=()=>GAMES[$("g").value];
async function j(u){const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
function resetMeter(){sets=[];P=null;$("ms").textContent="CHỜ TÍNH...";$("mf").style.width="0";$("tier").textContent="";$("mt").innerHTML="";$("out").innerHTML="<small>Chưa có</small>"}
function balls(g,d){
 if(!d)return"—";const c=g.col;
 if(g.d3)return d.nums.slice(0,6).map((x,i)=>(i==3?'<span class="sep"></span>':"")+`<span class="b" style="background:${c}">${x}</span>`).join("");
 return d.nums.map((x,i)=>(g.sp&&i==g.dn?'<span class="sep"></span>':"")+`<span class="b" style="background:${i>=g.dn&&g.sp?g.sp:c}">${String(x).padStart(2,"0")}</span>`).join("")}
async function load(){
 const g=G();let ok=false,msg="";
 try{S=await j("data/status.json")}catch(e){S=null}
 let base=[];try{base=(await j("data/"+g.src+".json")).draws}catch(e){}
 const old=D[g.src],mn=man(g.src);D[g.src]=merge(base,mn);
 if(old&&(old[0]?.id!==D[g.src][0]?.id||old.length!==D[g.src].length))resetMeter();
 const dr=D[g.src],gs=S?.games?.[g.src],age=S?Date.now()-new Date(S.updated):1e12;
 const ld=dr[0]?.date,dd=ld?(Date.now()-new Date(ld))/864e5:1e9,vn=ld?ld.split("-").reverse().slice(0,2).join("/"):"";
 if(dr.length&&dd<=4&&((gs?.ok&&age<24*36e5)||mn.length)){ok=true;$("st").className="ok";$("st").textContent="Dữ liệu thật"+(mn.length?" + nhập tay":"")+" · đến "+vn}
 else if(dr.length){$("st").className="warn";$("st").textContent="Dữ liệu cũ · đến "+vn}
 else{$("st").className="bad";$("st").textContent="Chưa có dữ liệu thật"}
 $("go").disabled=dr.length<30;
 $("note").textContent=dr.length<30?"Cần ≥30 kỳ thật để chạy AI (hiện "+dr.length+"). Chờ GitHub Actions nạp dữ liệu.":(gs&&!gs.ok?"Lỗi nạp dữ liệu: "+gs.error:"Nguồn: bản sao công khai vietlott-data, không phải trực tiếp vietlott.vn.");
 const l=dr[0];$("last").innerHTML=balls(g,l);$("lm").textContent=l?`Kỳ #${l.id} · ${l.date} · ${dr.length} kỳ trong kho`:"";
 $("jp").textContent=l?.jp?l.jp.toLocaleString("vi-VN")+"đ":"—";
 stats(g,dr)}
function weights(dr){return dr.map((_,i)=>Math.pow(.995,i))}
function freqP(g,dr){ // p[pos][idx]
 const w=weights(dr);
 if(g.d3){const p=[0,1,2].map(()=>Array(10).fill(.01));dr.forEach((d,i)=>d.nums.forEach((x,t)=>p[t%3][x]+=w[i]));return p.map(norm)}
 const p=Array(g.max).fill(.01);dr.forEach((d,i)=>d.nums.slice(0,g.dn).forEach(x=>p[x-1]+=w[i]));return[norm(p)]}
function markovP(g,dr){
 if(g.d3)return freqP(g,dr);
 const T=Array.from({length:g.max},()=>Array(g.max).fill(.01));
 for(let i=1;i<dr.length;i++){const a=dr[i].nums.slice(0,g.dn),b=dr[i-1].nums.slice(0,g.dn);a.forEach(x=>b.forEach(y=>T[x-1][y-1]+=1))}
 const p=Array(g.max).fill(0);dr[0].nums.slice(0,g.dn).forEach(x=>{const s=T[x-1].reduce((a,b)=>a+b);T[x-1].forEach((v,i)=>p[i]+=v/s)});return[norm(p)]}
const norm=a=>{const s=a.reduce((x,y)=>x+y);return a.map(v=>v/s)};
function pick(p){let r=Math.random(),i=0;for(;i<p.length-1;i++){r-=p[i];if(r<=0)break}return i}
function gen(g,pp){
 if(g.d3)return Array.from({length:g.k},()=>[0,1,2].map(t=>pick(pp[t])).join(""));
 const s=[];while(s.length<g.pick){const v=pick(pp[0])+1;if(g.rep||!s.includes(v))s.push(v)}return g.rep?s:s.sort((a,b)=>a-b)}
function okSet(g,s){
 if(g.d3)return s.length==g.k&&s.every(x=>/^\d{3}$/.test(x));
 return s.length==g.pick&&s.every(x=>Number.isInteger(x)&&x>=1&&x<=g.max)&&(g.rep||new Set(s).size==s.length)}
function lift(g,pp,s){
 if(g.d3)return s.reduce((a,x)=>a+[0,1,2].reduce((b,t)=>b+pp[t][+x[t]]*10,0)/3,0)/s.length;
 return s.reduce((a,x)=>a+pp[0][x-1],0)/s.length*g.max}
const cl=x=>Math.max(0,Math.min(1,x));
function meter(g,dr,pp,ss,fresh){
 const L=ss.map(s=>lift(g,pp,s)),m=L.reduce((a,b)=>a+b)/L.length,sd=Math.sqrt(L.reduce((a,b)=>a+(b-m)**2,0)/L.length);
 const flat=pp.flat(),pool=flat.length,top=[...flat].sort((a,b)=>b-a).slice(0,Math.max(1,Math.ceil(pool*.1))),
  topMass=top.reduce((a,b)=>a+b)/(top.length/pool),H=-flat.reduce((a,v)=>a+v*Math.log(v),0)/pp.length,conc=1-H/Math.log(pool/pp.length);
 const fp=freqP(g,dr.slice(0,60)),ref=fp.map(p=>[...p].map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,g.d3?5:g.pick*2).map(x=>x[1]));
 let hit=0,tot=0;ss.forEach(s=>{if(g.d3)s.forEach(x=>[0,1,2].forEach(t=>{tot++;if(ref[t].includes(+x[t]))hit++}));else s.forEach(x=>{tot++;if(ref[0].includes(x-1))hit++})});
 const v=ss.filter(s=>okSet(g,s)).length/ss.length;
 const f={mean:cl((m-.9)/.6),top:cl((topMass-1)/.5),conc:cl(conc*30),sep:cl((Math.max(...L)-1)/.8),stab:ss.length<2?.5:cl(1-sd/m),dq:cl(dr.length/300)*(fresh?1:.3),agree:hit/tot,valid:v};
 f.score=Math.round(100*v*(.2*f.mean+.15*f.top+.1*f.conc+.15*f.sep+.1*f.stab+.15*f.dq+.15*f.agree));return f}
function show(f){
 $("ms").textContent=f.score+"%";$("mf").style.width=f.score+"%";
 $("tier").textContent=f.score>=75?"CẢNH BÁO CAO":f.score>=55?"ĐANG TĂNG NHIỆT":f.score>=35?"ỔN ĐỊNH":"THẤP";
 const n={mean:"Mean",top:"Top 10% mass",conc:"Concentration",sep:"Separation",stab:"Stability",dq:"Data quality",agree:"Agreement",valid:"Validation"};
 $("mt").innerHTML=Object.keys(n).map(k=>`<span>${n[k]} <b>${Math.round(f[k]*100)}%</b></span>`).join("")}
function stats(g,dr){
 if(!dr.length){$("hot").innerHTML="";$("sm").textContent="";return}
 const c={};dr.forEach(d=>(g.d3?d.nums:d.nums.slice(0,g.dn)).forEach(x=>c[x]=(c[x]||0)+1));
 const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);$("sm").textContent=`(${dr.length} kỳ thật)`;
 const f=a=>a.slice(0,6).map(x=>`${g.d3?x[0]:String(x[0]).padStart(2,"0")}×${x[1]}`).join(" ");
 $("hot").innerHTML=`<tr><td>Ra nhiều</td><td>${f(e)}</td></tr><tr><td>Ra ít</td><td>${f([...e].reverse())}</td></tr>`}
$("go").onclick=()=>{
 const g=G(),dr=D[g.src];if(!dr||dr.length<30)return;
 const pp=$("mo").value=="markov"?markovP(g,dr):freqP(g,dr);P=pp;
 const n=+$("n").value;sets=[];let guard=0;
 while(sets.length<n&&guard++<500){const s=gen(g,pp);if(!sets.some(t=>t.join()==s.join()))sets.push(s)}
 const c=g.col;$("out").innerHTML=sets.map(s=>"<div>"+(g.d3?s.map(x=>[...x].map(d=>`<span class="b" style="background:${c}">${d}</span>`).join("")).join('<span class="sep"></span>'):s.map(x=>`<span class="b" style="background:${c}">${String(x).padStart(2,"0")}</span>`).join(""))+"</div>").join("");
 show(meter(g,dr,pp,sets,$("st").className=="ok"))};
function man(src){try{return JSON.parse(localStorage.getItem("vl_man_"+src)||"[]")}catch(e){return[]}}
function merge(a,b){const m=new Map();[...a,...b].forEach(d=>m.set(d.id,d));return[...m.values()].sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:y.id-x.id).slice(0,600)}
function okDraw(g,d){const a=d.nums;
 if(g.d3)return a.length>=6&&a.length%3==0&&a.every(x=>x>=0&&x<=9);
 return a.length==g.dn+(g.bonus||0)&&a.every(x=>x>=1&&x<=g.max)&&(g.rep||new Set(a.slice(0,g.dn)).size==g.dn)}
function parseImp(g,txt){const ok=[],bad=[];
 txt.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(l=>{
  const id=(l.match(/#\s*(\d{3,7})/)||[])[1],dm=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!id||!dm){bad.push(l);return}
  const rest=l.replace(/#\s*\d+/,"").replace(dm[0],"").replace(/Th[ứu]\s*\d/i,"").replace(/\d{1,2}:\d{2}/,"").replace(/[^\d\s,;|]/g," ");
  const t=rest.match(/\d+/g)||[],nums=g.d3?t.join("").split("").map(Number):t.map(Number);
  const d={id,date:dm[3]+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0"),nums,jp:null};
  (okDraw(g,d)?ok:bad).push(okDraw(g,d)?d:l)});
 return{ok,bad}}
$("impgo").onclick=()=>{const g=G(),r=parseImp(g,$("imp").value);
 if(r.ok.length){try{localStorage.setItem("vl_man_"+g.src,JSON.stringify(merge(man(g.src),r.ok)))}catch(e){}$("imp").value="";resetMeter();load()}
 $("impmsg").textContent="Đã thêm "+r.ok.length+" kỳ"+(r.bad.length?"; "+r.bad.length+" dòng sai định dạng/luật: "+r.bad[0].slice(0,40):"")};
$("impex").onclick=async()=>{const m=man(G().src);try{await navigator.clipboard.writeText(JSON.stringify(m));$("impmsg").textContent="Đã chép sao lưu "+m.length+" kỳ"}catch(e){$("impmsg").textContent="Không chép được"}};
$("impdel").onclick=()=>{try{localStorage.removeItem("vl_man_"+G().src)}catch(e){}resetMeter();load();$("impmsg").textContent="Đã xóa dữ liệu nhập tay của game này"};
["g","mo","n"].forEach(i=>$(i).onchange=()=>{resetMeter();if(i=="g"){$("mo").disabled=!!G().d3;load()}});
$("mo").disabled=!!G().d3;
load();setInterval(load,60000);
if("serviceWorker"in navigator){}
</script></body></html>
